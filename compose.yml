services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-facet_development}
      POSTGRES_USER: ${POSTGRES_USER:-facet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facet}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction", "--tcp-keepalive", "60"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-facet}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-facet-development-secret}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000
        "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-facet}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-facet-development-secret}
      S3_BUCKET: ${S3_BUCKET:-facet-development}
    depends_on:
      minio:
        condition: service_healthy

  css:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    command: ["bin/rails", "tailwindcss:watch[always]"]
    environment:
      HOME: /tmp
      POSTGRES_DB: ${POSTGRES_DB:-facet_development}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-facet_test}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-facet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facet}
    volumes:
      - .:/app

  web:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
      POSTGRES_DB: ${POSTGRES_DB:-facet_development}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-facet_test}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-facet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facet}
      MAILER_HOST: ${MAILER_HOST:-localhost}
      MAILER_PORT: ${MAILER_PORT:-3000}
      MAILER_FROM: ${MAILER_FROM:-no-reply@facet.local}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_NETWORK_TIMEOUT: ${REDIS_NETWORK_TIMEOUT:-5}
      REDIS_POOL_TIMEOUT: ${REDIS_POOL_TIMEOUT:-5}
      OPERATIONS_USERNAME: ${OPERATIONS_USERNAME:-}
      OPERATIONS_PASSWORD: ${OPERATIONS_PASSWORD:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-https://api.mistral.ai/v1}
      MISTRAL_CONVERSATION_MODEL: ${MISTRAL_CONVERSATION_MODEL:-mistral-large-2512}
      MISTRAL_UTILITY_MODEL: ${MISTRAL_UTILITY_MODEL:-mistral-small-latest}
      BFL_API_KEY: ${BFL_API_KEY:-}
      BFL_BASE_URL: ${BFL_BASE_URL:-https://api.bfl.ai/v1}
      BFL_IMAGE_MODEL: ${BFL_IMAGE_MODEL:-flux-2-klein-9b}
      BFL_IMAGE_WIDTH: ${BFL_IMAGE_WIDTH:-768}
      BFL_IMAGE_HEIGHT: ${BFL_IMAGE_HEIGHT:-1024}
      BFL_SAFETY_TOLERANCE: ${BFL_SAFETY_TOLERANCE:-5}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-facet-development}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-facet}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-facet-development-secret}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      AI_DEBUG_UI: ${AI_DEBUG_UI:-true}
      AI_DEBUG_PAYLOADS: ${AI_DEBUG_PAYLOADS:-false}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      css:
        condition: service_started
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    volumes:
      - .:/app

  worker:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    environment:
      HOME: /tmp
      POSTGRES_DB: ${POSTGRES_DB:-facet_development}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-facet_test}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-facet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facet}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_NETWORK_TIMEOUT: ${REDIS_NETWORK_TIMEOUT:-5}
      REDIS_POOL_TIMEOUT: ${REDIS_POOL_TIMEOUT:-5}
      SIDEKIQ_CONCURRENCY: ${SIDEKIQ_CONCURRENCY:-5}
      SIDEKIQ_SHUTDOWN_TIMEOUT: ${SIDEKIQ_SHUTDOWN_TIMEOUT:-25}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-https://api.mistral.ai/v1}
      MISTRAL_CONVERSATION_MODEL: ${MISTRAL_CONVERSATION_MODEL:-mistral-large-2512}
      MISTRAL_UTILITY_MODEL: ${MISTRAL_UTILITY_MODEL:-mistral-small-latest}
      BFL_API_KEY: ${BFL_API_KEY:-}
      BFL_BASE_URL: ${BFL_BASE_URL:-https://api.bfl.ai/v1}
      BFL_IMAGE_MODEL: ${BFL_IMAGE_MODEL:-flux-2-klein-9b}
      BFL_IMAGE_WIDTH: ${BFL_IMAGE_WIDTH:-768}
      BFL_IMAGE_HEIGHT: ${BFL_IMAGE_HEIGHT:-1024}
      BFL_SAFETY_TOLERANCE: ${BFL_SAFETY_TOLERANCE:-5}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-facet-development}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-facet}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-facet-development-secret}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      AI_DEBUG_UI: ${AI_DEBUG_UI:-true}
      AI_DEBUG_PAYLOADS: ${AI_DEBUG_PAYLOADS:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    stop_grace_period: 35s
    volumes:
      - .:/app

  outbox:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    command: ["bin/rails", "runner", "Outbox::Runner.call"]
    restart: unless-stopped
    environment:
      HOME: /tmp
      POSTGRES_DB: ${POSTGRES_DB:-facet_development}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-facet_test}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-facet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facet}
      RAILS_MAX_THREADS: 2
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_NETWORK_TIMEOUT: ${REDIS_NETWORK_TIMEOUT:-5}
      REDIS_POOL_TIMEOUT: ${REDIS_POOL_TIMEOUT:-5}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1}
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
    volumes:
      - .:/app

volumes:
  minio_data:
  postgres_data:
  redis_data:
