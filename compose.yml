services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: facet_development
      POSTGRES_USER: facet
      POSTGRES_PASSWORD: facet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facet -d facet_development"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
      POSTGRES_HOST: db
      POSTGRES_USER: facet
      POSTGRES_PASSWORD: facet
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/app

volumes:
  postgres_data:
