services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-facet_development}
      POSTGRES_USER: ${POSTGRES_USER:-facet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facet}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data

  css:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    command: ["bin/rails", "tailwindcss:watch[always]"]
    environment:
      HOME: /tmp
      POSTGRES_DB: ${POSTGRES_DB:-facet_development}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-facet_test}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-facet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facet}
    volumes:
      - .:/app

  web:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
      POSTGRES_DB: ${POSTGRES_DB:-facet_development}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-facet_test}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-facet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facet}
      MAILER_HOST: ${MAILER_HOST:-localhost}
      MAILER_PORT: ${MAILER_PORT:-3000}
      MAILER_FROM: ${MAILER_FROM:-no-reply@facet.local}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CONVERSATION_MODEL: ${OPENAI_CONVERSATION_MODEL:-gpt-4o}
      OPENAI_UTILITY_MODEL: ${OPENAI_UTILITY_MODEL:-gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      css:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/app

  worker:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    environment:
      HOME: /tmp
      POSTGRES_DB: ${POSTGRES_DB:-facet_development}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-facet_test}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-facet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facet}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CONVERSATION_MODEL: ${OPENAI_CONVERSATION_MODEL:-gpt-4o}
      OPENAI_UTILITY_MODEL: ${OPENAI_UTILITY_MODEL:-gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
  redis_data:
