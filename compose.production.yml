x-app-env: &app-env
  RAILS_ENV: production
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
  APP_HOST: ${APP_HOST:?Set APP_HOST}
  SMTP_ADDRESS: ${SMTP_ADDRESS:?Set SMTP_ADDRESS}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAILER_FROM: ${MAILER_FROM:?Set MAILER_FROM}
  OPERATIONS_USERNAME: ${OPERATIONS_USERNAME:?Set OPERATIONS_USERNAME}
  OPERATIONS_PASSWORD: ${OPERATIONS_PASSWORD:?Set OPERATIONS_PASSWORD}
  AI_PROVIDER: ${AI_PROVIDER:-mistral}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  BFL_API_KEY: ${BFL_API_KEY:-}
  AI_GLOBAL_MONTHLY_LIMIT_MICROUSD: ${AI_GLOBAL_MONTHLY_LIMIT_MICROUSD:-100000000}
  AI_DEBUG_UI: "false"
  AI_DEBUG_PAYLOADS: "false"
  S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?Set S3_PUBLIC_ENDPOINT}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}

services:
  web:
    image: facet:production
    build:
      context: .
      dockerfile: Dockerfile.production
    environment: *app-env
    init: true
    restart: unless-stopped
    stop_grace_period: 35s
    ports:
      - "127.0.0.1:3000:3000"

  worker:
    image: facet:production
    environment:
      <<: *app-env
      SIDEKIQ_CONCURRENCY: ${SIDEKIQ_CONCURRENCY:-5}
      SIDEKIQ_SHUTDOWN_TIMEOUT: ${SIDEKIQ_SHUTDOWN_TIMEOUT:-25}
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    init: true
    restart: unless-stopped
    stop_grace_period: 35s

  outbox:
    image: facet:production
    environment: *app-env
    command: ["bin/rails", "runner", "Outbox::Runner.call"]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
