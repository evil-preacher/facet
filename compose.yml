services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: facet_development
      POSTGRES_USER: facet
      POSTGRES_PASSWORD: facet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facet -d facet_development"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  css:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    command: ["bin/rails", "tailwindcss:watch[always]"]
    environment:
      HOME: /tmp
      POSTGRES_HOST: db
      POSTGRES_USER: facet
      POSTGRES_PASSWORD: facet
    volumes:
      - .:/app

  web:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
      POSTGRES_HOST: db
      POSTGRES_USER: facet
      POSTGRES_PASSWORD: facet
      MAILER_HOST: localhost
      MAILER_PORT: 3000
      SMTP_ADDRESS: mailpit
      SMTP_PORT: 1025
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      css:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      - .:/app

volumes:
  postgres_data:
